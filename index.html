<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Посещаемость группы</title>
<style>
:root{--bg:#f3f4f9;--card:#fff;--ink:#1c2033;--muted:#5d6277;--line:#e3e5ef;--accent:#33408f;--present:#187a48;--late:#8f5606;--absent:#b02f2f;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:sans-serif;font-size:16px;line-height:1.45}
.app{max-width:640px;margin:0 auto;padding:16px 14px 56px}
header{padding:6px 2px 14px}
h1{font-size:22px;margin:0;color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin:2px 0 14px;font-weight:600}
.daterow{display:flex;align-items:center;gap:8px}
.daterow button{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:19px;cursor:pointer}
.datebox{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px 10px;text-align:center}
.datebox input{width:100%;border:none;font-size:15px;font-weight:700;background:transparent;text-align:center;font-family:inherit}
.weekday{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tab{flex:1;border:none;background:transparent;padding:10px 4px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:600;cursor:pointer}
.tab.active{background:var(--accent);color:#fff}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters input[type=text]{flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--line);font-size:15px}
.filters select{padding:11px 8px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.summary-cell{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;border-top:3px solid var(--line)}
.summary-cell .num{font-size:18px;font-weight:700;display:block}
.summary-cell .lbl{font-size:10.5px;color:var(--muted)}
.c-present{border-top-color:var(--present)}
.c-late{border-top-color:var(--late)}
.c-absent{border-top-color:var(--absent)}
.c-none{border-top-color:var(--muted)}
.refresh-row{display:flex;justify-content:flex-end;margin:10px 0 2px}
.refresh-row button{border:none;background:none;color:var(--accent);font-weight:600;padding:4px 2px;cursor:pointer}
details.bulk{margin-top:8px}
details.bulk summary{font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;list-style:none}
details.bulk summary::before{content:"▸ "}
details.bulk[open] summary::before{content:"▾ "}
details.bulk .bulk-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
details.bulk button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer}
ul.student-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.student-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.student-name{font-size:15px;font-weight:600;margin-bottom:8px}
.status-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status-btn{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:11px 4px;font-size:13px;font-weight:700;color:var(--muted);min-height:44px;cursor:pointer}
.status-btn.active.present{background:#e1f4ea;border-color:var(--present);color:var(--present)}
.status-btn.active.late{background:#faf0dd;border-color:var(--late);color:var(--late)}
.status-btn.active.absent{background:#fbe7e7;border-color:var(--absent);color:var(--absent)}
.empty-hint{text-align:center;color:var(--muted);padding:28px 8px}
table.stats-table{width:100%;border-collapse:collapse;font-size:13.5px}
table.stats-table th,table.stats-table td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
table.stats-table th{color:var(--muted);font-weight:600;font-size:11.5px}
table.stats-table td.num,table.stats-table th.num{text-align:center}
.settings-row{display:flex;gap:8px}
.settings-row input[type=text]{flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--line);font-size:15px}
.settings-row button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
ul.roster-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.roster-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.roster-row button{border:none;background:none;color:#b02f2f;font-size:16px;padding:2px 6px;font-weight:700;cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);z-index:20;padding:20px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div><div>Загрузка данных…</div></div>

<div class="app" id="app" style="display:none;">
  <header>
    <h1 id="groupTitleText">Группа</h1>
    <div class="sub">Учёт посещаемости (синхронизация)</div>
    <div class="daterow">
      <button id="prevDay">‹</button>
      <div class="datebox">
        <input type="date" id="datePicker">
        <span class="weekday" id="weekdayLabel"></span>
      </div>
      <button id="nextDay">›</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="mark">Отметка</button>
    <button class="tab" data-tab="stats">Статистика</button>
    <button class="tab" data-tab="settings">Группа</button>
  </nav>

  <section class="panel active" id="panel-mark">
    <div class="card">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Найти по фамилии…">
        <select id="statusFilter">
          <option value="all">Все</option>
          <option value="none">Не отмечены</option>
          <option value="P">Был</option>
          <option value="L">Опоздал</option>
          <option value="A">Не был</option>
        </select>
      </div>
      <div class="summary-grid" id="summaryLine"></div>
      <div class="refresh-row"><button id="refreshBtn">↻ Обновить</button></div>
      <details class="bulk">
        <summary>Действия старосты</summary>
        <div class="bulk-actions">
          <button id="markAllPresentBtn">Отметить всех как «Был»</button>
          <button id="clearDayBtn">Очистить день</button>
        </div>
      </details>
    </div>
    <ul class="student-list" id="studentList"></ul>
  </section>

  <section class="panel" id="panel-stats">
    <div class="card">
      <div class="empty-hint" id="statsLoading">Загружаю статистику…</div>
      <table class="stats-table" id="statsTable" hidden>
        <thead><tr><th>Студент</th><th class="num">Был</th><th class="num">Опозд.</th><th class="num">Не был</th><th class="num">%</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="panel-settings">
    <div class="card">
      <h2 class="sub" style="margin-bottom:10px;">Название группы</h2>
      <div class="settings-row">
        <input type="text" id="groupNameInput" placeholder="Название">
        <button id="saveGroupNameBtn">Сохранить</button>
      </div>
    </div>
    <div class="card">
      <h2 class="sub" style="margin-bottom:10px;">Список группы (<span id="rosterCount">0</span>)</h2>
      <ul class="roster-list" id="rosterList"></ul>
      <div class="settings-row">
        <input type="text" id="newStudentInput" placeholder="Фамилия И. О.">
        <button id="addStudentBtn">Добавить</button>
      </div>
      <div class="hint">Данные синхронизируются через jsonbin.io. Все пользователи видят одни и те же изменения.</div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ================================================================
// ВСТАВЬ СВОЙ API-КЛЮЧ (X-Master-Key)
// ================================================================
const API_KEY = '$2a$10$8iKbqkcEhIfiTNkG7.2mNuQGBoktv3ft7ZzuXI5rUEiRpLUrmyWum';

// Базовый список группы (если данных нет)
const DEFAULT_ROSTER = [
  "Абрамов В. М.","Артемов Е. Р.","Аушев Д. О.","Васильев А. А.","Васильченко И. А.",
  "Гаврильченко А. А.","Гадаев М. Р.","Гребенькова М. В.","Доронин М. Р.","Зыков Н. А.",
  "Казарян А. Б.","Кириченко А. В. (С)","Кирюшатов А. П.","Колесов Е. Р.","Конаков В. Д.",
  "Костюков К. С.","Крюков И. А.","Левченко И. С.","Муталиев М. Р.","Новосел А. Г.",
  "Паршин Р. В.","Патрахин И. Д.","Петриченко А. И.","Плохотинченко Д. И.","Рыженко К. С.",
  "Селезнев И. В.","Харченко Д. А.","Чуванько Ю. М.","Шматко А. Е."
];

// ================================================================
// Состояние
// ================================================================
const state = {
  roster: { nextId: 1, students: [] },
  groupName: '',
  currentDate: new Date(),
  dayData: {},
  searchTerm: '',
  statusFilter: 'all'
};

// Храним ID бина в localStorage после создания
let binId = localStorage.getItem('jsonbin_binId') || null;

// ================================================================
// Работа с jsonbin.io (автосоздание бина)
// ================================================================
async function ensureBin() {
  if (binId) {
    try {
      // Проверяем, существует ли бин
      const test = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (test.ok) return binId;
    } catch(e) {}
    // Если бин не найден, удаляем сохранённый ID и создаём новый
    localStorage.removeItem('jsonbin_binId');
    binId = null;
  }

  // Создаём новый бин
  const response = await fetch('https://api.jsonbin.io/v3/b', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': API_KEY
    },
    body: JSON.stringify({})
  });
  if (!response.ok) throw new Error('Не удалось создать бин');
  const data = await response.json();
  binId = data.metadata.id;
  localStorage.setItem('jsonbin_binId', binId);
  return binId;
}

async function loadFromBin() {
  if (!binId) await ensureBin();
  const url = `https://api.jsonbin.io/v3/b/${binId}/latest`;
  const response = await fetch(url, {
    headers: { 'X-Master-Key': API_KEY }
  });
  if (!response.ok) throw new Error('Не удалось загрузить данные');
  const data = await response.json();
  return data.record;
}

async function saveToBin(data) {
  if (!binId) await ensureBin();
  const url = `https://api.jsonbin.io/v3/b/${binId}`;
  const response = await fetch(url, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': API_KEY
    },
    body: JSON.stringify(data)
  });
  if (!response.ok) throw new Error('Не удалось сохранить данные');
  return response.json();
}

// ================================================================
// Загрузка/сохранение всех данных
// ================================================================
async function loadAllData() {
  try {
    await ensureBin(); // убеждаемся, что бин существует
    const remote = await loadFromBin();
    state.roster = remote.roster || { nextId: DEFAULT_ROSTER.length+1, students: DEFAULT_ROSTER.map((name,i)=>({id:'s'+(i+1),name})) };
    state.groupName = remote.groupName || 'Группа';
    state.dayData = remote.dayData || {};
    renderGroupTitle();
    renderRosterSettings();
  } catch (e) {
    console.error('Ошибка загрузки:', e);
    state.roster = { nextId: DEFAULT_ROSTER.length+1, students: DEFAULT_ROSTER.map((name,i)=>({id:'s'+(i+1),name})) };
    state.groupName = 'Группа';
    state.dayData = {};
    renderGroupTitle();
    renderRosterSettings();
  }
}

async function saveAllData() {
  const data = {
    roster: state.roster,
    groupName: state.groupName,
    dayData: state.dayData
  };
  await saveToBin(data);
}

// ================================================================
// Вспомогательные функции
// ================================================================
function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDateKey(s){
  const parts = s.split('-');
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}
function formatWeekday(d){
  try { return d.toLocaleDateString('ru-RU', { weekday: 'long' }); } catch(e){ return ''; }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function statusClass(code){
  if (code === 'P') return 'present';
  if (code === 'L') return 'late';
  if (code === 'A') return 'absent';
  return '';
}

// ================================================================
// RENDER FUNCTIONS
// ================================================================
function renderStudentList() {
  const ul = document.getElementById('studentList');
  const term = state.searchTerm.trim().toLowerCase();
  const filter = state.statusFilter;
  const dayData = state.dayData[dateKey(state.currentDate)] || {};
  const items = state.roster.students.filter(s => {
    if (term && s.name.toLowerCase().indexOf(term) === -1) return false;
    const st = dayData[s.id] || '';
    if (filter === 'none' && st !== '') return false;
    if (filter === 'P' && st !== 'P') return false;
    if (filter === 'L' && st !== 'L') return false;
    if (filter === 'A' && st !== 'A') return false;
    return true;
  });
  if (!items.length){
    ul.innerHTML = '<li class="empty-hint">Никого не найдено</li>';
    return;
  }
  ul.innerHTML = items.map(s => {
    const st = dayData[s.id] || '';
    const btn = (code, label) => {
      const active = st === code ? ' active' : '';
      return `<button type="button" class="status-btn ${statusClass(code)}${active}" data-status="${code}">${label}</button>`;
    };
    return `<li class="student-row" data-id="${s.id}">
      <div class="student-name">${escapeHtml(s.name)}</div>
      <div class="status-buttons">${btn('P','Был')}${btn('L','Опоздал')}${btn('A','Не был')}</div>
    </li>`;
  }).join('');
}

function renderSummary() {
  const total = state.roster.students.length;
  const dayData = state.dayData[dateKey(state.currentDate)] || {};
  let p=0,l=0,a=0;
  state.roster.students.forEach(s => {
    const st = dayData[s.id];
    if (st === 'P') p++; else if (st === 'L') l++; else if (st === 'A') a++;
  });
  const none = total - p - l - a;
  document.getElementById('summaryLine').innerHTML = `
    <div class="summary-cell c-present"><span class="num">${p}</span><span class="lbl">Был</span></div>
    <div class="summary-cell c-late"><span class="num">${l}</span><span class="lbl">Опоздал</span></div>
    <div class="summary-cell c-absent"><span class="num">${a}</span><span class="lbl">Не был</span></div>
    <div class="summary-cell c-none"><span class="num">${none}</span><span class="lbl">Не отмечен</span></div>
  `;
}

function renderDateUI() {
  document.getElementById('datePicker').value = dateKey(state.currentDate);
  document.getElementById('weekdayLabel').textContent = formatWeekday(state.currentDate);
}

function renderGroupTitle() {
  document.getElementById('groupTitleText').textContent = state.groupName || 'Группа';
  document.getElementById('groupNameInput').value = state.groupName || '';
}

function renderRosterSettings() {
  const ul = document.getElementById('rosterList');
  document.getElementById('rosterCount').textContent = state.roster.students.length;
  ul.innerHTML = state.roster.students.map(s => `
    <li class="roster-row" data-id="${s.id}">
      <span>${escapeHtml(s.name)}</span>
      <button class="removeStudentBtn" data-id="${s.id}">✕</button>
    </li>`).join('');
}

function renderStats() {
  const loadingEl = document.getElementById('statsLoading');
  const tableEl = document.getElementById('statsTable');
  tableEl.hidden = true;
  loadingEl.hidden = false;
  loadingEl.textContent = 'Загружаю статистику…';
  const stats = {};
  Object.keys(state.dayData).forEach(date => {
    const day = state.dayData[date];
    Object.keys(day).forEach(studentId => {
      if (!stats[studentId]) stats[studentId] = {P:0,L:0,A:0};
      stats[studentId][day[studentId]] = (stats[studentId][day[studentId]] || 0) + 1;
    });
  });
  const rows = state.roster.students.map(s => {
    const t = stats[s.id] || {P:0,L:0,A:0};
    const sum = t.P + t.L + t.A;
    const pct = sum > 0 ? Math.round((t.P/sum)*100) : null;
    return { name: s.name, P: t.P, L: t.L, A: t.A, pct, sortKey: t.L + t.A };
  });
  if (!rows.length) { loadingEl.textContent = 'Нет данных'; return; }
  rows.sort((a,b) => b.sortKey - a.sortKey);
  document.getElementById('statsBody').innerHTML = rows.map(r => `
    <tr>
      <td>${escapeHtml(r.name)}</td>
      <td class="num">${r.P}</td>
      <td class="num">${r.L}</td>
      <td class="num">${r.A}</td>
      <td class="num">${r.pct === null ? '—' : r.pct+'%'}</td>
    </tr>`).join('');
  loadingEl.hidden = true;
  tableEl.hidden = false;
}

// ================================================================
// Действия
// ================================================================
async function setStatus(studentId, newStatus) {
  const key = dateKey(state.currentDate);
  if (!state.dayData[key]) state.dayData[key] = {};
  const dayData = state.dayData[key];
  if (newStatus) dayData[studentId] = newStatus;
  else delete dayData[studentId];
  await saveAllData();
  renderStudentList();
  renderSummary();
}

// ================================================================
// TOAST
// ================================================================
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ================================================================
// TABS
// ================================================================
function switchTab(name){
  document.querySelectorAll('.tab').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === name);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-'+name);
  });
  if (name === 'stats') renderStats();
  if (name === 'settings') renderRosterSettings();
}

// ================================================================
// DATE NAVIGATION
// ================================================================
function goToDate(d) {
  state.currentDate = d;
  renderDateUI();
  renderStudentList();
  renderSummary();
}

// ================================================================
// EVENTS
// ================================================================
function setupEvents() {
  document.getElementById('prevDay').addEventListener('click', () => {
    const d = new Date(state.currentDate); d.setDate(d.getDate()-1); goToDate(d);
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    const d = new Date(state.currentDate); d.setDate(d.getDate()+1); goToDate(d);
  });
  document.getElementById('datePicker').addEventListener('change', e => {
    if (!e.target.value) return;
    goToDate(parseDateKey(e.target.value));
  });
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    try {
      await loadAllData();
      goToDate(state.currentDate);
      showToast('Данные обновлены');
    } catch(e) { showToast('Ошибка обновления: ' + e.message); }
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    state.searchTerm = e.target.value; renderStudentList();
  });
  document.getElementById('statusFilter').addEventListener('change', e => {
    state.statusFilter = e.target.value; renderStudentList();
  });

  document.getElementById('markAllPresentBtn').addEventListener('click', async () => {
    const key = dateKey(state.currentDate);
    if (!state.dayData[key]) state.dayData[key] = {};
    const dayData = state.dayData[key];
    const todo = state.roster.students.filter(s => !dayData[s.id]);
    if (!todo.length) { showToast('Все уже отмечены'); return; }
    todo.forEach(s => dayData[s.id] = 'P');
    await saveAllData();
    renderStudentList();
    renderSummary();
    showToast('Отмечены присутствующими: ' + todo.length);
  });

  document.getElementById('clearDayBtn').addEventListener('click', async () => {
    if (!confirm('Очистить все отметки за этот день?')) return;
    const key = dateKey(state.currentDate);
    if (state.dayData[key]) {
      delete state.dayData[key];
      await saveAllData();
      renderStudentList();
      renderSummary();
      showToast('День очищен');
    } else {
      showToast('Нет отметок для очистки');
    }
  });

  document.getElementById('studentList').addEventListener('click', async e => {
    const btn = e.target.closest('.status-btn');
    if (!btn) return;
    const row = e.target.closest('.student-row');
    const id = row.getAttribute('data-id');
    const status = btn.getAttribute('data-status');
    const key = dateKey(state.currentDate);
    const dayData = state.dayData[key] || {};
    const current = dayData[id] || null;
    const newStatus = (current === status) ? null : status;
    await setStatus(id, newStatus);
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
  });

  document.getElementById('saveGroupNameBtn').addEventListener('click', async () => {
    const v = document.getElementById('groupNameInput').value.trim();
    if (v) {
      state.groupName = v;
      await saveAllData();
      renderGroupTitle();
      showToast('Название сохранено');
    }
  });

  document.getElementById('addStudentBtn').addEventListener('click', async () => {
    const input = document.getElementById('newStudentInput');
    const name = input.value.trim();
    if (!name) return;
    const id = 's' + state.roster.nextId;
    state.roster.nextId += 1;
    state.roster.students.push({ id, name });
    input.value = '';
    await saveAllData();
    renderRosterSettings();
    renderStudentList();
    showToast('Добавлено: ' + name);
  });

  document.getElementById('rosterList').addEventListener('click', async e => {
    const btn = e.target.closest('.removeStudentBtn');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    const name = state.roster.students.find(s => s.id === id)?.name || id;
    if (!confirm(`Удалить ${name} из списка группы?`)) return;
    state.roster.students = state.roster.students.filter(s => s.id !== id);
    await saveAllData();
    renderRosterSettings();
    renderStudentList();
    showToast('Удалено: ' + name);
  });
}

// ================================================================
// INIT
// ================================================================
async function init() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  try {
    await loadAllData();
    renderDateUI();
    renderStudentList();
    renderSummary();
    renderGroupTitle();
    renderRosterSettings();
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    setupEvents();
  } catch (e) {
    document.getElementById('loadingOverlay').innerHTML = '<div>Ошибка загрузки. Проверьте API-ключ.</div>';
    console.error(e);
  }
}

init();

})();
</script>
</body>
</html>
